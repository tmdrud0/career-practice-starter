name: cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/career-practice-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/career-practice-${{ matrix.service }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: publish-images
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Explain skipped deploy
        if: ${{ env.KUBE_CONFIG_DATA == '' || env.GHCR_PULL_TOKEN == '' }}
        run: |
          echo "KUBE_CONFIG or GHCR_PULL_TOKEN is missing."
          echo "Image publish completed, but deploy was skipped."

      - name: Checkout
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Set lowercase owner
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"

      - name: Prepare cluster secrets
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        run: |
          kubectl create namespace career-practice --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-creds \
            --namespace career-practice \
            --docker-server=ghcr.io \
            --docker-username='${{ github.repository_owner }}' \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "$OPENAI_API_KEY" ]; then
            kubectl create secret generic ai-service-secrets \
              --namespace career-practice \
              --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Render Kubernetes manifest
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        run: |
          chmod +x ./scripts/render-k8s.sh
          export USER_SERVICE_IMAGE="ghcr.io/${{ steps.owner.outputs.value }}/career-practice-user-service:${{ github.sha }}"
          export PRODUCT_SERVICE_IMAGE="ghcr.io/${{ steps.owner.outputs.value }}/career-practice-product-service:${{ github.sha }}"
          export ORDER_SERVICE_IMAGE="ghcr.io/${{ steps.owner.outputs.value }}/career-practice-order-service:${{ github.sha }}"
          export AI_SERVICE_IMAGE="ghcr.io/${{ steps.owner.outputs.value }}/career-practice-ai-service:${{ github.sha }}"
          ./scripts/render-k8s.sh k8s/ghcr-template.yaml k8s/rendered-ghcr.yaml

      - name: Deploy to Kubernetes
        if: ${{ env.KUBE_CONFIG_DATA != '' && env.GHCR_PULL_TOKEN != '' }}
        run: |
          kubectl apply -f k8s/rendered-ghcr.yaml
          kubectl rollout status deployment/user-service -n career-practice --timeout=180s
          kubectl rollout status deployment/product-service -n career-practice --timeout=180s
          kubectl rollout status deployment/order-service -n career-practice --timeout=180s
          kubectl rollout status deployment/ai-service -n career-practice --timeout=180s

