apiVersion: v1
kind: Namespace
metadata:
  name: career-practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: career-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: career-practice
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: career-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: career-practice
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: career-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: career-practice
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: career-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ai-service:local
          imagePullPolicy: Never
          env:
            - name: OPENAI_API_KEY
              value: ""
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: career-practice
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

