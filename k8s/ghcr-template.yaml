apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: career-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: ai-service
          image: __AI_SERVICE_IMAGE__
          imagePullPolicy: Always
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: OPENAI_API_KEY
                  optional: true
          ports:
            - containerPort: 8084
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: career-practice
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

